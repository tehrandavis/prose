name: build and test

on:
  push:
    branches: [main]
  pull_request:
  # Nightly release checks and Preview publication at 18:00 UTC.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Run the Mac checks on main and publish Prose Preview
        type: boolean
        default: false

permissions:
  contents: read

# Prose is Mac only. Each run selects only what its changes need:
# - The `changes` job diffs changed paths (scripts/ci_changes.py): any change
#   outside the documentation runs Mac regression; docs-only changes run no
#   macOS job. Pull requests diff against their base; main pushes against the
#   last successful main run, so a cancelled or failed run's changes stay
#   selected.
# - Pull requests and main pushes run exactly the same checks. A main push
#   that selected the Mac jobs then publishes the opt-in alpha channel of Prose
#   Preview once Mac regression passes.
# - The nightly schedule on main runs everything: Mac regression, Mac App Store
#   validation and Mac memory safety, then signs and publishes Prose Preview
#   once Mac regression and App Store validation pass. It skips only when this
#   commit already had a fully successful nightly.
# - Manual dispatches run everything; on main they add the App Store and
#   memory checks. `publish_preview` on main also publishes Preview between
#   nightlies.
# - A newer run cancels an older one with the same event and ref, so pushes
#   never cancel nightly or manual runs. A cancelled publication is harmless:
#   at worst it leaves a build release that the next publication supersedes.
# The `build and test` gate is the only required check; it accepts a skipped
# job only when the selection did not require it.

# Keep only the newest run per ref and event: the event name keeps main
# pushes from cancelling nightly and manual runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mac: ${{ steps.select.outputs.mac }}
      release: ${{ steps.select.outputs.release }}
      publish: ${{ steps.select.outputs.publish }}
      channel: ${{ steps.select.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: CI policy contracts
        run: python3 scripts/test-ci-policy.py
      - name: Select jobs from changed paths
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: python3 scripts/ci_changes.py select
  integration:
    name: Mac regression
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROSE_DISTRIBUTION: preview
    # Leaves room for one cold patched Tinymist build after its inputs change.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Strict SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Cache engine dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-render
            Engine/RenderBridge/target
          key: render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/RenderBridge/Cargo.lock', 'Engine/RenderBridge/Cargo.toml', 'Engine/RenderBridge/src/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Cache parser dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-syntax
            Engine/SyntaxBridge/target
          key: syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/SyntaxBridge/Cargo.lock', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Cache MCP dependencies and helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-mcp
            Tools/MCPServer/target
          key: mcp-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('Tools/MCPServer/Cargo.lock') }}
      - name: Prepare pinned Hurl and validate Rust bridge
        run: |
          source scripts/environment.sh
          scripts/prepare-mcp-hurl.sh
          scripts/build-mcp.sh
          export CARGO_HOME="$PWD/.tools/cargo-mcp"
          cargo +1.92.0 fmt --manifest-path Tools/MCPServer/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path Tools/MCPServer/Cargo.toml --all-targets --no-deps -- -D warnings
          cargo +1.92.0 test --locked --manifest-path Tools/MCPServer/Cargo.toml
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Build the engine library and validate the Rust bridges
        run: |
          source scripts/environment.sh
          scripts/build-render.sh
          export CARGO_HOME="$PWD/.tools/cargo-render"
          cargo +1.92.0 fmt --manifest-path Engine/RenderBridge/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path Engine/RenderBridge/Cargo.toml --all-targets --no-deps -- -D warnings -D unsafe_op_in_unsafe_fn
          cargo +1.92.0 test --locked --release --manifest-path Engine/RenderBridge/Cargo.toml
          export CARGO_HOME="$PWD/.tools/cargo-syntax"
          cargo +1.92.0 fmt --manifest-path Engine/SyntaxBridge/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path Engine/SyntaxBridge/Cargo.toml --all-targets --no-deps -- -D warnings -D unsafe_op_in_unsafe_fn
          cargo +1.92.0 test --locked --manifest-path Engine/SyntaxBridge/Cargo.toml
      - name: Functional integration tests and 80% coverage gate
        run: scripts/test.sh
      - name: Cold-launch the packaged app with saved MCP access
        run: |
          source scripts/environment.sh
          scripts/build.sh release
          python3 scripts/smoke-app.py --app 'build/Prose Preview.app' --development-resources "$(swift build -c release --show-bin-path)/Prose_ProseCore.bundle" --hurl .tools/hurl/bin/hurl
      - name: Upload packaged launch diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-launch-macos-15
          path: build/launch-smoke
          if-no-files-found: ignore
          retention-days: 14
      # Codecov uploads are temporarily disabled while CLI downloads fail TLS handshakes.
      - name: Real book editing and navigation benchmarks
        run: scripts/benchmark-books.sh
      - name: Upload book performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-performance-macos-15
          path: build/benchmarks
          if-no-files-found: warn
          retention-days: 14
      - name: Release automation contracts
        run: |
          source scripts/environment.sh
          python3 scripts/test-preview-release.py
          python3 scripts/test-staple-app.py
          python3 scripts/test-appstore-release.py
          python3 scripts/test-running-app.py
          python3 scripts/test-tinymist-build.py
          python3 scripts/test-package-graphs.py
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then
            cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/benchmarks/summary.md ]; then
            cat build/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-macos-15
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14
  appstore:
    name: Mac App Store validation
    # Nightly and manual main runs only; `release` implies Mac jobs are selected.
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-15
    # A cold engine cache compiles Typst (scripts/build-render.sh).
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROSE_DISTRIBUTION: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: appstore-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-
      - name: Cache engine dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-render
            Engine/RenderBridge/target
          key: render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/RenderBridge/Cargo.lock', 'Engine/RenderBridge/Cargo.toml', 'Engine/RenderBridge/src/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Verify App Store build excludes the updater
        run: |
          source scripts/environment.sh
          scripts/build-render.sh
          PROSE_INTEGRATION=1 swift test -Xswiftc -warnings-as-errors --filter distributionUsesMatchingAppIdentity
          binary="$(swift build --show-bin-path)/Prose"
          if otool -L "$binary" | grep -q Sparkle; then
            echo 'App Store binary unexpectedly links Sparkle.' >&2
            exit 1
          fi
  memory:
    name: Memory safety (${{ matrix.check }})
    # Nightly and manual main runs only; `release` implies Mac jobs are selected.
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-15
    # A cold engine cache compiles Typst (scripts/build-render.sh).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        check: [leaks, address]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROSE_DISTRIBUTION: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: memory-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Cache engine dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-render
            Engine/RenderBridge/target
          key: render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/RenderBridge/Cargo.lock', 'Engine/RenderBridge/Cargo.toml', 'Engine/RenderBridge/src/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Check memory
        run: scripts/check-memory.sh "${{ matrix.check }}"
      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-${{ matrix.check }}-macos-15
          path: build/memory
          if-no-files-found: warn
          retention-days: 14
  # Both channels depend only on their Mac checks, not on the combined gate.
  # Nightly also requires App Store validation; alpha needs Mac regression.
  preview:
    name: Signed preview
    needs: [changes, integration, appstore]
    if: >-
      !cancelled() && needs.changes.outputs.publish == 'true' && needs.integration.result == 'success' &&
      ((needs.changes.outputs.channel == 'nightly' && needs.appstore.result == 'success') ||
      needs.changes.outputs.channel == 'alpha')
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.package-name.outputs.name }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROSE_DISTRIBUTION: preview
      PROSE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      PROSE_PREVIEW_CHANNEL: ${{ needs.changes.outputs.channel }}
    steps:
      - name: Identify this package
        id: package-name
        run: echo "name=Prose-Preview-${PROSE_BUILD_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: preview-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Cache engine dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-render
            Engine/RenderBridge/target
          key: render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/RenderBridge/Cargo.lock', 'Engine/RenderBridge/Cargo.toml', 'Engine/RenderBridge/src/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            render-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Sign, notarize and prepare the update
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ICLOUD_PREVIEW_PROVISIONING_PROFILE: ${{ secrets.ICLOUD_PREVIEW_PROVISIONING_PROFILE }}
        run: scripts/release.sh
      - name: Cold-launch the signed package
        run: |
          source scripts/environment.sh
          scripts/prepare-mcp-hurl.sh
          python3 scripts/smoke-app.py --app 'build/Prose Preview.app' --development-resources "$(swift build -c release --show-bin-path)/Prose_ProseCore.bundle" --hurl .tools/hurl/bin/hurl
      - name: Upload runnable app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package-name.outputs.name }}
          path: |
            build/release/*.zip
            build/release/*.sha256
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 7
      - name: Release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-diagnostics
          path: |
            build/notarization
            build/launch-smoke
          if-no-files-found: ignore
          retention-days: 7
  publish-preview:
    name: Publish preview update
    needs: [changes, preview]
    # Alpha skips App Store validation. Override implicit success() so that
    # a skipped ancestor cannot suppress publication of a successful package.
    if: ${{ !cancelled() && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preview.outputs.artifact-name }}
          path: build/release
      - name: Publish versioned package and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_CHANNEL: ${{ needs.changes.outputs.channel }}
        run: python3 scripts/publish-preview.py
  gate:
    name: build and test
    needs: [changes, integration, appstore, memory]
    # Always report, so a failed, cancelled or wrongly skipped job fails the
    # required check instead of leaving it skipped (which GitHub treats as passing).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false
      # Each selected job must pass and every other job must be skipped:
      # path filters skip jobs, never fail or cancel them.
      - name: Require every selected job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py gate
